[project]
name = "mixhand"
version = "0.1.0"
description = "Claude Code for Logic Pro"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
mixhand = "mixhand.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: drives the real Logic Pro; run with MIXHAND_LIVE=1"]
